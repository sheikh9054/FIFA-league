# Deploy backend API to Render (free tier)
# Frontend deploys separately on Vercel — see DEPLOY_VERCEL.md

services:
  - type: web
    name: fifa-league-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run render:start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: ALLOW_VERCEL_PREVIEWS
        value: "false"
