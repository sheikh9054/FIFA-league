version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fifa-league-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fifa
      POSTGRES_PASSWORD: fifa_secret
      POSTGRES_DB: fifa_league
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fifa -d fifa_league"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fifa-league-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://fifa:fifa_secret@postgres:5432/fifa_league?schema=public
      PORT: 4000
      NODE_ENV: production
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: change-this-in-production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
